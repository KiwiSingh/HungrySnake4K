[tool.briefcase]
project_name = "Hungry Snake 4K"
bundle = "com.kiwisingh"
name = "HungrySnake4K"
version = "3.0.1"
author = "Kiwi Singh"
author_email = "kiwisingh@proton.me"
license = "MIT"

[tool.briefcase.app.HungrySnake4K]
formal_name = "Hungry Snake 4K"
description = "A classic snake game built for mobile."
icon = "assets/HungrySnake4K"
# Only Python source directories go here
sources = ["src/HungrySnake4K"]
requires = [
    "toga-iOS~=0.5.6"
]
test_requires = []
orientation = "portrait"

[tool.briefcase.app.HungrySnake4K.macOS]
universal_build = true

[tool.briefcase.app.HungrySnake4K.android]
build_gradle_dependencies = []
supported_features = []

[tool.briefcase.app.HungrySnake4K.ios]
supported_features = []
# Add all audio files (and any other assets) as resources
resources = [
    "assets/background_score.mp3",
    "assets/food_blip.wav",
    "assets/game_over.wav",
    "assets/player1_begin.wav",
    "assets/player1_wins.wav",
    "assets/player2_begin.wav",
    "assets/player2_wins.wav",
    "assets/its_a_draw.wav",
]