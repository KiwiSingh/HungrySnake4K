name: Build Hungry Snake 4K — macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pygame py2app

      - name: Build .app
        run: |
          python setup.py py2app

      - name: Zip app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Hungry Snake 4K.app" \
            "HungrySnake4K-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HungrySnake4K-macOS
          path: HungrySnake4K-macOS.zip
