name: Build iOS IPA (unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec xcodegen.yml

      - name: Build for iOS (generic device)
        run: |
          xcodebuild -project HungrySnake4K.xcodeproj \
            -scheme HungrySnake4K \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./build/HungrySnake4K.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p ./build/Payload
          cp -R ./build/HungrySnake4K.xcarchive/Products/Applications/HungrySnake4K.app ./build/Payload/
          cd ./build
          zip -r HungrySnake4K.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HungrySnake4K-iOS-IPA
          path: ./build/HungrySnake4K.ipa
