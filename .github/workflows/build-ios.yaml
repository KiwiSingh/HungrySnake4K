name: Build iOS IPA (unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec xcodegen.yml

      - name: Build for iOS (generic device)
        run: |
          xcodebuild -project HungrySnake4K.xcodeproj \
            -scheme HungrySnake4K \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./build/HungrySnake4K.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create exportOptions.plist (unsigned)
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>DUMMY</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict/>
          </dict>
          </plist>
          EOF

      - name: Export IPA (unsigned)
        run: |
          xcodebuild -exportArchive \
            -archivePath ./build/HungrySnake4K.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HungrySnake4K-iOS-IPA
          path: ./build/HungrySnake4K.ipa
