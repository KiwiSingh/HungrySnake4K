name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper (if missing)
        run: |
          cd android
          if [ ! -f gradlew ]; then
            # Generate the wrapper using the system gradle (pre‑installed on runner)
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HungrySnake4K-release.apk
          path: android/app/build/outputs/apk/release/*.apk