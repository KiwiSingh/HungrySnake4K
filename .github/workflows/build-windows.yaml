name: Build Hungry Snake 4K — Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: HungrySnake4K-Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame pyinstaller pillow

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onefile `
            --name "Hungry Snake 4K" `
            --icon "HungrySnake4K.ico" `
            --version-file "version_info.txt" `
            --add-data "assets;assets" `
            --collect-all pygame `
            --collect-all PIL `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HungrySnake4K-Windows
          path: HungrySnake4K-Windows/dist/Hungry Snake 4K.exe
